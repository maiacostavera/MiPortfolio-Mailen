<!doctype html>
<!--
  Fuente de la imagen que se ve al compartir el link (LinkedIn, WhatsApp, Slack).
  Se regenera con: npm run brand   (desde frontend/)
-->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; margin: 0; }
      body {
        width: 1200px;
        height: 630px;
        background: #f7f5ef;
        color: #14110e;
        font-family: 'Inter', sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 52px 68px;
        position: relative;
        overflow: hidden;
        -webkit-print-color-adjust: exact;
      }

      /* Retícula editorial de fondo, muy tenue */
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, rgba(20,17,14,.055) 1px, transparent 1px);
        background-size: 150px 100%;
      }

      .rule { position: absolute; left: 0; right: 0; height: 1px; background: rgba(20,17,14,.12); }

      header, main, footer { position: relative; }

      header { display: flex; align-items: center; justify-content: space-between; }

      .mark {
        width: 54px; height: 54px; border-radius: 12px; background: #a8480a;
        display: grid; place-items: center;
      }
      .mark svg { width: 54px; height: 54px; }

      .eyebrow {
        font-family: 'IBM Plex Mono', monospace;
        font-size: 16px; letter-spacing: .22em; text-transform: uppercase; color: #8b8377;
      }

      main { margin-bottom: 0; }

      .section-tag {
        font-family: 'IBM Plex Mono', monospace;
        font-size: 16px; letter-spacing: .2em; text-transform: uppercase;
        color: #a8480a; margin-bottom: 20px;
        display: flex; align-items: center; gap: 18px;
      }
      .section-tag::after { content: ''; height: 1px; width: 120px; background: rgba(20,17,14,.18); }

      h1 {
        font-family: 'Playfair Display', serif;
        font-size: 78px; font-weight: 600; line-height: 1.02; letter-spacing: -.025em;
        margin-bottom: 22px;
      }

      .role {
        font-family: 'Playfair Display', serif;
        font-style: italic; font-weight: 500; font-size: 34px; color: #a8480a; line-height: 1.25;
      }

      footer {
        display: flex; align-items: flex-end; justify-content: space-between;
        padding-top: 24px; border-top: 1px solid rgba(20,17,14,.14);
      }

      .stack { display: flex; gap: 12px; flex-wrap: wrap; }
      .chip {
        font-family: 'IBM Plex Mono', monospace; font-size: 15px; letter-spacing: .04em;
        color: #5f574c; border: 1px solid rgba(20,17,14,.16); border-radius: 3px;
        padding: 6px 12px; background: #fffdf8;
      }
      .url {
        font-family: 'IBM Plex Mono', monospace; font-size: 17px; letter-spacing: .07em;
        color: #14110e; white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="rule" style="top: 0; background: #a8480a; height: 7px;"></div>

    <header>
      <div class="mark">
        <svg viewBox="0 0 48 48"><path d="M13 35V13l11 13 11-13v22" fill="none" stroke="#f7f5ef" stroke-width="4.5" stroke-linecap="square" stroke-linejoin="round"/></svg>
      </div>
      <span class="eyebrow">Buenos Aires, Argentina</span>
    </header>

    <main>
      <div class="section-tag">§ Portfolio</div>
      <h1>Mailen Acosta&nbsp;Vera</h1>
      <div class="role">Desarrolladora de software<br />&amp; auditora de sistemas.</div>
    </main>

    <footer>
      <div class="stack">
        <span class="chip">React</span>
        <span class="chip">Node.js</span>
        <span class="chip">Angular</span>
        <span class="chip">Kotlin</span>
        <span class="chip">QA / Testing</span>
        <span class="chip">Auditoría BCRA</span>
      </div>
      <span class="url">maiacostavera.github.io</span>
    </footer>
  </body>
</html>
